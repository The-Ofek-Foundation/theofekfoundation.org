{% extends 'main_app/main_app_base.html' %}

{% load static %}

{% block header_additions %}

{{block.super}}
<link rel="stylesheet" type="text/css" href="{% static "assets/styles/utilstyles.css" %}">
<link rel="stylesheet" type="text/css" href="{% static "assets/styles/games/styles.css" %}">

{% endblock %}

{% block right_float_additions %}
<li id="new-game-float" class="right-float-additions" onclick="newGame();">
	<span class="mobile-only">N</span><span class="desktop-only">New Game</span>
</li>

<li id="show-settings-float" class="right-float-additions" onclick="showSettingsForm();">
	<span class="mobile-only">S</span><span class="desktop-only">Settings</span>
</li>
{% endblock %}

{% block end_block %}

<script type="text/javascript" src="{% static "assets/javascript/games/utils.js" %}"></script>
<script type="text/javascript" src="{% static "assets/javascript/utils.js" %}?v=2"></script>

{% if game_settings %}
<script type="text/javascript">
	{% autoescape off %}
	var settings = convertKeysObject({{ game_settings }});
	{% endautoescape %}
	// Settings saved in this browser (GameSettings.saveSettings in utils.js).
	Object.assign(settings, GameSettings.loadLocal(settings.gameName));
	gameSettings = new GameSettings(settings.gameName, settings);
</script>
{% endif %}

{% endblock %}
