<!DOCTYPE html>

<html>
	<head>
		<!-- Global site tag (gtag.js) - Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-81202457-1"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);}
		  gtag('js', new Date());

		  gtag('config', 'UA-81202457-1');
		</script>
		<!-- Google Analytics end -->

		<title>{% block title %}{% endblock %}</title>

		<!-- Mobile detection (replaces the old server-side minidetector middleware):
		     adds class="mobile" to <html>; elements use mobile-only / desktop-only. -->
		<script>
			if (/Mobi|Android|iP(hone|od|ad)|BlackBerry|IEMobile|Opera Mini|Silk|Kindle|webOS/i.test(navigator.userAgent)
					|| (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)))
				document.documentElement.classList.add('mobile');
		</script>
		<style>
			html:not(.mobile) .mobile-only, html.mobile .desktop-only { display: none !important; }
			/* Firebase Authentication state (set by JS): html.signed-in shows .auth-signed-in. */
			html:not(.signed-in) .auth-signed-in, html.signed-in .auth-signed-out { display: none !important; }
		</style>

		{% block head_block %}{% endblock %}
	</head>

	<body>
		{% block body_block %}{% endblock %}
	</body>

	{% block end_block %}{% endblock %}
</html>
