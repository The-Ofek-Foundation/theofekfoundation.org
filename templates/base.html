<!DOCTYPE html>

<html>
	<head>
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-W2YLGQXGNB"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);}
		  gtag('js', new Date());

		  gtag('config', 'G-W2YLGQXGNB');
		</script>
		<!-- Google Analytics end -->

		<title>{% block title %}{% endblock %}</title>

		<!-- Mobile detection (replaces the old server-side minidetector middleware):
		     adds class="mobile" to <html>; elements use mobile-only / desktop-only. -->
		<script>
			if (/Mobi|Android|iP(hone|od|ad)|BlackBerry|IEMobile|Opera Mini|Silk|Kindle|webOS/i.test(navigator.userAgent)
					|| (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)))
				document.documentElement.classList.add('mobile');
		</script>
		<style>
			html:not(.mobile) .mobile-only, html.mobile .desktop-only { display: none !important; }
			/* Firebase Authentication state (set by JS): html.signed-in shows .auth-signed-in. */
			html:not(.signed-in) .auth-signed-in, html.signed-in .auth-signed-out { display: none !important; }
		</style>
		<script>
			// Shows who is signed in (name) or that nobody is (null): toggles html.signed-in,
			// fills in the username elements, and fires a "signedinchange" event on document.
			// Called by firebase_auth.js once Firebase knows; until then, the last known name
			// (cached in localStorage) avoids a flash of "Login".
			function showSignedInName(name) {
				document.documentElement.classList.toggle('signed-in', name !== null);
				var fill = function () {
					if (name !== null) {
						var navbarName = document.getElementById('navbar-username');
						if (navbarName)  // the old site showed 6 characters on phones
							navbarName.textContent = document.documentElement.classList.contains('mobile')
								? Array.from(name).slice(0, 6).join('') : name;
						document.querySelectorAll('.signed-in-name').forEach(function (elem) {
							elem.textContent = name;
						});
					}
					document.dispatchEvent(new CustomEvent('signedinchange', {detail: {name: name}}));
				};
				if (document.readyState === 'loading')
					document.addEventListener('DOMContentLoaded', fill);
				else
					fill();
			}
			try {
				if (localStorage.getItem('auth:displayName') !== null)
					showSignedInName(localStorage.getItem('auth:displayName'));
			} catch (e) {}
		</script>

		{% block head_block %}{% endblock %}
	</head>

	<body>
		{% block body_block %}{% endblock %}
	</body>

	{% block end_block %}{% endblock %}
</html>
